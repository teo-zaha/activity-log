[package]
name = "core"
edition.workspace = true
version.workspace = true
license.workspace = true

[lib]
name = "activity_log_core"
path = "src/lib.rs"

[features]
# `MemoryStore` and `Secrets::with_stores`, for the tests of the crates that build a `Secrets`.
test-support = []
# The tests against a real OS secure store (`tests/real_secret_store.rs`), run by CI only.
real-store-tests = []

[dependencies]
# `aes-siv`'s own `zeroize` feature leaves its parts' alone: these lines only unify the
# features, so the AES key schedules, the CMAC state and the CTR state are wiped on drop too.
aes = { version = "=0.9.4", default-features = false, features = ["zeroize"] }
aes-siv = { version = "=0.8.0", default-features = false, features = ["alloc", "zeroize"] }
anyhow.workspace = true
base64 = "0.23"
calcard = { version = "0.3", default-features = false }
chrono.workspace = true
chrono-tz.workspace = true
# 0.0.7's `.env` parser, for its one import (`settings::legacy_import`) only; it touches no
# environment through `from_path_iter`.
dotenvy = "=0.15.7"
cmac = { version = "=0.8.0", default-features = false, features = ["zeroize"] }
ctr = { version = "=0.10.1", default-features = false, features = ["zeroize"] }
futures.workspace = true
getrandom = "0.4"
gix = "0.90"
hex = "0.4"
html-escape = "0.3"
iana-time-zone = "0.1"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2 = "0.11"
strum.workspace = true
subtle = "2.6"
tokio.workspace = true
ts-rs.workspace = true
toml_edit = "0.25"
url = "2.5"
zeroize = "1"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSURL"] }
security-framework = "3.7"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
# The Secret Service over D-Bus, used directly (`oo7::dbus`), never through the Flatpak portal.
oo7 = "=0.7.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", features = [
  "Wdk_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Credentials",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_EventLog",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Ole",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_UI_Shell",
] }

[[test]]
name = "real_secret_store"
required-features = ["real-store-tests"]

[dev-dependencies]
tempfile = "3.27"
tokio = { workspace = true, features = ["test-util"] }
urlencoding.workspace = true
