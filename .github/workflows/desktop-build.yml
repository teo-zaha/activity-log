# Builds the desktop bundles on all three systems, on a `v*` tag and by hand. The macOS
# build costs ten Linux minutes for each of its own, the Windows one two.
name: Desktop Build (All OS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# A newer run started by hand on the same branch stops the one before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # pnpm-workspace.yaml points at the company Artifactory, which hosted
      # runners can't reach. pnpm gives that setting precedence over
      # --registry/env, so drop it; the lockfile carries no tarball URLs.
      - name: Use public npm registry
        shell: bash
        run: sed -i.bak -e '/^registry:/d' -e '/^registries:/,/^  default:/d' pnpm-workspace.yaml

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The installer is built from our copy of Tauri's NSIS template: it must be the CLI's
      - name: Check the NSIS template matches the Tauri CLI
        if: matrix.os == 'windows-latest'
        shell: bash
        run: desktop/installer/template.sh check

      - name: Build desktop bundle
        run: pnpm desktop:build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/release/bundle/**
            desktop/target/release/bundle/**
