<section class="no-sources" aria-label="Add your first source">
  <app-empty-state class="panel" heading="Add your first source" [level]="2">
    <span emptyStateVisual class="logos" aria-hidden="true">
      @for (source of previews; track source) {
        <app-provider-icon [source]="source" size="lg" />
      }
    </span>
    Your timeline is built from the sources you add: Git commits, GitLab and Jira activity, meetings
    and more.
    @if (isDesktop) {
      <button appButton emptyStateAction variant="primary" icon="add" (click)="addSource()">
        Add source
      </button>
    } @else {
      <p emptyStateAction class="desktop-only">
        Add sources in the desktop app, or with <code>activity-log sources add</code>.
      </p>
    }
  </app-empty-state>
</section>
