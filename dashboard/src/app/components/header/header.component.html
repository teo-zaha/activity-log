<header class="app-header">
  <div
    class="window-drag-strip"
    (mousedown)="startWindowDrag($event)"
    (dblclick)="toggleWindowMaximize($event)"
  ></div>
  <div class="header-inner">
    <div class="brand">
      <span class="brand-icon material-icons" aria-hidden="true">timeline</span>
      <span class="brand-title">Activity Log</span>
    </div>

    <div class="controls">
      <div class="ctrl-input-wrap">
        <span class="ctrl-label">From</span>
        <input
          class="ctrl-input"
          [matDatepicker]="pickerFrom"
          placeholder=""
          [ngModel]="dateFromObj()"
          [max]="dateToObj()"
          (dateChange)="activity.dateFrom.set(fmtDate($event.value))"
        />
        <mat-datepicker-toggle [for]="pickerFrom"></mat-datepicker-toggle>
        <mat-datepicker #pickerFrom></mat-datepicker>
      </div>

      <div class="ctrl-input-wrap">
        <span class="ctrl-label">To</span>
        <input
          class="ctrl-input"
          [matDatepicker]="pickerTo"
          placeholder=""
          [ngModel]="dateToObj()"
          [min]="dateFromObj()"
          (dateChange)="activity.dateTo.set(fmtDate($event.value))"
        />
        <mat-datepicker-toggle [for]="pickerTo"></mat-datepicker-toggle>
        <mat-datepicker #pickerTo></mat-datepicker>
      </div>

      <button
        class="btn-apply"
        (click)="apply()"
        [disabled]="activity.isLoading()"
        [class.loading]="activity.isLoading()"
        matTooltip="Collect activity for selected range"
      >
        @if (activity.isLoading()) {
          <span class="material-icons spin" aria-hidden="true">sync</span>
        } @else {
          <span class="material-icons" aria-hidden="true">play_arrow</span>
        }
        {{ activity.isLoading() ? 'Collecting…' : 'Apply' }}
      </button>

      <button
        class="btn-icon"
        (click)="exportMd()"
        [disabled]="!activity.meta()"
        matTooltip="Export Markdown"
        aria-label="Export Markdown"
      >
        <span class="material-icons" aria-hidden="true">description</span>
      </button>

      <button
        class="btn-icon"
        (click)="exportJson()"
        [disabled]="!activity.meta()"
        matTooltip="Export JSON"
        aria-label="Export JSON"
      >
        <span class="material-icons" aria-hidden="true">data_object</span>
      </button>
    </div>
  </div>
</header>
