[workspace]
members = ["core", "api", "cli", "desktop"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }
rfd = "0.17"
rocket = { version = "0.5", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.54", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
ts-rs = { version = "12.0", default-features = false, features = [
  "chrono-impl",
] }
urlencoding = "2.1"
