# Runs the Windows-gated code (Event Log, Outlook COM, Credential Manager, the
# desktop's WebView2 keys and title bar) through clippy and the test suite on a
# real Windows host. `pnpm verify` only covers the dev host OS.
#
# A Windows minute costs twice a Linux one, so this does not run on every pull
# request: it runs on each push to main, and on any branch by hand (Actions ›
# Windows › Run workflow, or `gh workflow run windows.yml --ref <branch>`). Run
# it before merging a change to Windows-gated code: the modules with
# `cfg(windows)` or `target_os = "windows"` code, file and path handling
# (`platform`, `settings`, `cache`, `secrets`), the desktop crate, dependencies.
name: Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

# A newer run of the same branch started by hand stops the one before it; runs
# on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The desktop crate builds without the dashboard here: without Tauri's
      # `custom-protocol` feature (only `tauri build` turns it on) it loads the
      # dev server instead of embedding `dashboard/dist`.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (real-store tests)
        run: cargo clippy -p core --all-targets --features real-store-tests -- -D warnings

      - name: Test
        run: cargo test --workspace

      # Credential Manager itself (core's real-store tests, on a credential of their own).
      # `CI=true` and this variable are the marker they refuse to run without.
      - name: Real secret store
        env:
          ACTIVITY_LOG_REAL_STORE_TESTS: '1'
        run: cargo test -p core --features real-store-tests --test real_secret_store
