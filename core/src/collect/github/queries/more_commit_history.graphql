query MoreCommitHistory(
  $id: ID!
  $viewerId: ID!
  $from: GitTimestamp!
  $to: GitTimestamp!
  $after: String!
) {
  node(id: $id) {
    ... on Repository {
      id
      nameWithOwner
      defaultBranchRef {
        name
        target {
          ... on Commit {
            history(
              first: 100
              after: $after
              author: { id: $viewerId }
              since: $from
              until: $to
            ) {
              pageInfo {
                hasNextPage
                endCursor
              }
              nodes {
                id
                oid
                committedDate
                messageHeadline
                url
              }
            }
          }
        }
      }
    }
  }
}
