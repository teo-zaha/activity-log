[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
The format follows [Keep a Changelog](https://keepachangelog.com/), and
versions adhere to [Semantic Versioning](https://semver.org/).
"""
# HTML comments inside group names (e.g. <!-- 0 -->) force a stable display
# order — markdown renderers hide them, but git-cliff sorts on the raw string.
body = """
{% set github_url = "" %}\
{% if not remote.offline and remote.github.owner and remote.github.repo %}\
{% set github_url = "https://github.com/" ~ remote.github.owner ~ "/" ~ remote.github.repo %}\
{% endif %}\
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}\
- {% if commit.scope %}**({{ commit.scope }})** {% endif %}{{ commit.message | split(pat="\\n") | first | upper_first }} *({{ commit.id | truncate(length=7, end="") }})*\
{% if commit.remote.username %} by @{{ commit.remote.username }}{% endif %}\
{% if github_url and commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}]({{ github_url }}/pull/{{ commit.remote.pr_number }}){% endif %}\
{% if commit.breaking and commit.breaking_description and commit.breaking_description != commit.message %}
{{ "  > **Breaking:** " }}{{ commit.breaking_description | split(pat="\\n") | first | trim }}{% endif %}
{% endfor %}
{% endfor %}\
{% if github.contributors %}\
{% set newcomers = github.contributors | filter(attribute="is_first_time", value=true) | filter(attribute="username") %}\
{% set shown_newcomers = false %}\
{% for contributor in newcomers %}\
{% if contributor.username is not ending_with("[bot]") %}\
{% if not shown_newcomers %}\
### New contributors

{% set_global shown_newcomers = true %}\
{% endif %}\
- @{{ contributor.username }} made their first contribution\
{% if github_url and contributor.pr_number %} in [#{{ contributor.pr_number }}]({{ github_url }}/pull/{{ contributor.pr_number }}){% endif %}
{% endif %}\
{% endfor %}\
{% if shown_newcomers %}
{% endif %}\
{% endif %}\
{% if github_url and version and previous.version %}\
[Full changelog]({{ github_url }}/compare/{{ previous.version }}...{{ version }})

{% endif %}\
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "^v(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$"
topo_order = false
sort_commits = "oldest"

# Parser order matters — first match wins.
#   1. Skip pipeline-internal commits
#   2. Hoist breaking commits into their own top group (matched via `!` suffix
#      on the type OR `BREAKING CHANGE` footer)
#   3. Group by conventional commit type
#   4. Catch-all for non-conventional commits
commit_parsers = [
  { message = "^chore\\(release\\)",   skip = true },
  { message = "^chore\\(changelog\\)", skip = true },
  { message = "^ci",                   skip = true },

  { message = "^[a-z]+(\\(.+\\))?!",   group = "<!-- 0 -->⚠️ Breaking Changes" },
  { footer  = "^BREAKING CHANGE",      group = "<!-- 0 -->⚠️ Breaking Changes" },

  { message = "^feat",     group = "<!-- 1 -->✨ Features" },
  { message = "^fix",      group = "<!-- 2 -->🐛 Bug Fixes" },
  { message = "^perf",     group = "<!-- 3 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 4 -->♻️ Refactor" },
  { message = "^docs",     group = "<!-- 5 -->📚 Documentation" },
  { message = "^style",    group = "<!-- 6 -->💎 Styling" },
  { message = "^test",     group = "<!-- 7 -->🧪 Testing" },
  { message = "^chore",    group = "<!-- 8 -->🔧 Miscellaneous" },
  { message = ".*",        group = "<!-- 9 -->📦 Other" },
]

[bump]
# A newer, untagged Cargo workspace version is released first. After that,
# git-cliff bumps the last tag: fixes use patch, features minor, and breaking
# changes major (or minor on 0.x).
features_always_bump_minor = true
breaking_always_bump_major = false
