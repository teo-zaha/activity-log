# The dashboard is zoneless. pnpm would otherwise auto-install @angular/core's optional zone.js
# peer, and the Angular unit-test builder then tries to load `zone.js/testing`.
overrides:
  zone.js: '-'

packages:
  - 'dashboard'
  - 'desktop'
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true

catalog:
  '@angular/build': ^22.2.5
  '@angular/cdk': ^22.2.5
  '@angular/cli': ^22.2.5
  '@angular/common': ^22.2.4
  '@angular/compiler': ^22.2.4
  '@angular/compiler-cli': ^22.2.4
  '@angular/core': ^22.2.4
  '@angular/forms': ^22.2.4
  '@angular/material': ^22.2.5
  '@angular/platform-browser': ^22.2.4
  '@angular/router': ^22.2.4
  # Pinned exactly while it is 0.x: read the release notes before bumping.
  '@formkit/auto-animate': 0.10.2
  # Pinned exactly while it is 0.x: read the release notes before bumping.
  '@signality/core': 0.5.0
  # Pinned exactly: the Timeline's virtual list depends on its measuring and scroll adjustment.
  '@tanstack/angular-virtual': 6.1.12
  '@tauri-apps/api': ^2.12.4
  '@tauri-apps/cli': ^2.12.4
  rxjs: ~7.8.2
  tslib: ^2.9.1
  typescript: ~6.0.3
