<div class="day-view">
  <!-- Navigation -->
  <div class="cal-nav">
    <div class="cal-heading">
      <h2 class="cal-title" [class.is-today]="isToday()">
        {{ title() }}
      </h2>
      @if (meetingTimeParts(); as parts) {
        <p
          class="cal-meeting-time"
          title="Meeting time"
          [attr.aria-label]="'Meetings: ' + meetingTimeLabel()"
        >
          <mat-icon>groups</mat-icon>
          @if (parts.busy) {
            <span class="mt-busy">{{ parts.busy }}</span>
          }
          @if (parts.tentative) {
            <span class="mt-tentative"
              >{{ parts.tentative }}<span class="mt-word"> tentative</span></span
            >
          }
        </p>
      }
    </div>
    <div class="nav-controls">
      <button
        appIconButton
        size="sm"
        icon="chevron_left"
        label="Previous day"
        appShortcut="calendar.previous"
        (click)="viewState.navigateDay(-1)"
      ></button>
      <button
        appButton
        variant="ghost"
        size="sm"
        class="today-btn"
        appShortcut="calendar.today"
        (click)="viewState.goToToday()"
      >
        Today
        <app-key-tag shortcut="calendar.today" />
      </button>
      <button
        appIconButton
        size="sm"
        icon="chevron_right"
        label="Next day"
        appShortcut="calendar.next"
        (click)="viewState.navigateDay(1)"
      ></button>
    </div>
    <div class="nav-controls zoom-controls">
      <button
        appIconButton
        size="sm"
        icon="remove"
        label="Zoom out"
        (click)="zoom.zoomOut()"
        [disabled]="!zoom.canZoomOut()"
        title="Zoom out (Ctrl + scroll or pinch)"
      ></button>
      <button
        appButton
        variant="ghost"
        size="sm"
        class="zoom-reset-btn"
        (click)="zoom.reset()"
        [disabled]="zoom.atDefault()"
        [attr.aria-label]="'Zoom ' + zoom.percent() + ', reset to 100%'"
        [title]="zoom.atDefault() ? 'Default zoom' : 'Reset zoom to 100%'"
      >
        {{ zoom.percent() }}
      </button>
      <button
        appIconButton
        size="sm"
        icon="add"
        label="Zoom in"
        (click)="zoom.zoomIn()"
        [disabled]="!zoom.canZoomIn()"
        title="Zoom in (Ctrl + scroll or pinch)"
      ></button>
    </div>
  </div>

  <!-- Grid -->
  <div class="cal-scroll" #scrollEl>
    <!-- All-day banner row for multi-day events -->
    @if (allDay().bars.length) {
      <div class="cal-sticky-header">
        <app-calendar-all-day-row [row]="allDay()" (openEvent)="openEvent($event)" />
      </div>
    }

    @if (emptyHint(); as hint) {
      <div class="u-floating-hint">
        <app-calendar-hint [hint]="hint" (collect)="collectRange($event)" />
      </div>
    }

    <div class="cal-grid" #gridEl [style.height.px]="gridHeight()">
      <app-calendar-hours
        [hourHeight]="viewState.hourHeight()"
        [coveredHour]="nowLine()?.coveredHour ?? null"
      />

      <div class="events-col">
        @if (nowLine(); as now) {
          <span class="now-label" [style.top.px]="now.top" aria-hidden="true">{{ now.label }}</span>
        }
        <app-calendar-day-column
          class="day-col"
          [column]="column()"
          [now]="nowLine()"
          (openEvent)="openEvent($event)"
          (openGroup)="openGroup($event)"
        />
      </div>
    </div>
  </div>
</div>
