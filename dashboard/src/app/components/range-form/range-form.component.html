<form class="range-form" [formRoot]="rangeForm" aria-label="Collection date range">
  <div #fields class="range" [class.is-disabled]="data.isLoading()">
    <label class="range-field">
      <span class="range-label">From</span>
      <input
        class="range-input"
        aria-label="From date"
        inputmode="decimal"
        [matDatepicker]="pickerFrom"
        [formField]="rangeForm.from"
        [max]="dateToObj()"
        (dateChange)="viewState.setDateFrom(fmtDate($event.value))"
      />
      <mat-datepicker-toggle class="range-toggle" [for]="pickerFrom" />
      <mat-datepicker #pickerFrom (opened)="pickerOpened()" (closed)="pickerClosed()" />
    </label>

    <mat-icon class="range-sep">arrow_forward</mat-icon>

    <label class="range-field">
      <span class="range-label">To</span>
      <input
        class="range-input"
        aria-label="To date"
        inputmode="decimal"
        [matDatepicker]="pickerTo"
        [formField]="rangeForm.to"
        [min]="dateFromObj()"
        (dateChange)="viewState.setDateTo(fmtDate($event.value))"
      />
      <mat-datepicker-toggle class="range-toggle" [for]="pickerTo" />
      <mat-datepicker #pickerTo (opened)="pickerOpened()" (closed)="pickerClosed()" />
    </label>
  </div>

  <button
    appButton
    type="submit"
    variant="primary"
    size="lg"
    icon="sync"
    class="btn-collect"
    [appShortcut]="'app.collect'"
    [busy]="data.isLoading()"
    [disabled]="data.isLoading()"
    [attr.aria-label]="data.isLoading() ? 'Collecting activity' : 'Collect activity'"
    matTooltip="Collect activity for the selected range"
  >
    <!-- Both labels share one grid cell so the button keeps its width while busy. -->
    <span class="btn-collect-label" aria-hidden="true">
      <span [class.is-inactive]="data.isLoading()">Collect</span>
      <span [class.is-inactive]="!data.isLoading()">Collecting…</span>
    </span>
    <app-key-tag class="btn-collect-key" shortcut="app.collect" />
  </button>
</form>
