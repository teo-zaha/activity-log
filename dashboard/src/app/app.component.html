<mat-progress-bar mode="indeterminate" class="top-loader" [class.visible]="activity.isLoading()" />

<app-header />

<main>
  <app-sidebar />

  <div class="main-content">
    @switch (activity.currentView()) {
      @case ('list') {
        <app-timeline />
      }
      @case ('day') {
        <app-day-view />
      }
      @case ('workweek') {
        <app-week-view />
      }
      @case ('week') {
        <app-week-view />
      }
    }
  </div>
</main>

<app-event-detail />
