<div class="search-dock">
  <div class="search-field">
    <mat-icon class="search-icon">search</mat-icon>
    <input
      #input
      class="search-input"
      type="search"
      enterkeyhint="search"
      [attr.aria-label]="label() ?? placeholder()"
      [placeholder]="placeholder()"
      [formField]="query"
      [appShortcut]="shortcut()"
      (keydown.escape)="clear()"
    />
    @if (value()) {
      <button
        appIconButton
        size="sm"
        icon="close"
        class="search-clear"
        [label]="clearLabel()"
        (click)="clear(); input.focus()"
      ></button>
    } @else if (shortcut(); as id) {
      <app-key-tag class="search-hint" [shortcut]="id" />
    }
  </div>
</div>
