query CommitHistory(
  $ids: [ID!]!
  $viewerId: ID!
  $from: GitTimestamp!
  $to: GitTimestamp!
  $releaseIds: [ID!]!
  $readReleases: Boolean!
  $pageSize: Int!
) {
  nodes(ids: $ids) {
    ... on Repository {
      id
      nameWithOwner
      defaultBranchRef {
        name
        target {
          ... on Commit {
            history(first: 100, author: { id: $viewerId }, since: $from, until: $to) {
              pageInfo {
                hasNextPage
                endCursor
              }
              nodes {
                id
                oid
                committedDate
                messageHeadline
                url
              }
            }
          }
        }
      }
    }
  }
  releaseNodes: nodes(ids: $releaseIds) @include(if: $readReleases) {
    ... on Repository {
      id
      nameWithOwner
      releases(first: $pageSize, orderBy: { field: CREATED_AT, direction: DESC }) {
        ...ReleasePage
      }
    }
  }
}
