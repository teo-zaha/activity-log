[package]
name = "cli"
edition.workspace = true
version.workspace = true
default-run = "activity-log"

[[bin]]
name = "activity-log"
path = "src/main.rs"

[[bin]]
name = "generate-ts"
path = "src/generate_ts.rs"

[dependencies]
activity-log-core = { package = "core", path = "../core" }
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
rpassword = "7.5"
serde_json.workspace = true
strum.workspace = true
tokio.workspace = true

[dev-dependencies]
# `test-support`: a `Secrets` over stores in memory, and no OS store in any `Secrets` the
# tests or the binaries they run build (feature unification), so no test reaches a keychain.
activity-log-core = { package = "core", path = "../core", features = ["test-support"] }
chrono-tz.workspace = true
tempfile = "3.27"
