<nav class="mobile-tabs" aria-label="Settings sections">
  <div class="mobile-tab-list">
    <button
      type="button"
      class="mobile-tab"
      [class.active]="selection() === 'general'"
      (click)="selectGeneral()"
    >
      <span class="mobile-tab-main">
        <mat-icon>tune</mat-icon>
        <span>General</span>
      </span>
    </button>

    @for (provider of providers(); track provider.info.id) {
      <button
        type="button"
        class="mobile-tab"
        [class.active]="selection() === `source:${provider.info.id}`"
        (click)="selectSource(provider.info.id)"
      >
        <span class="mobile-tab-main">
          <span class="mobile-tab-icon" [attr.data-status]="provider.info.status">
            <app-provider-icon
              class="mobile-tab-brand"
              [source]="provider.info.id"
              [fallbackIcon]="provider.icon"
            ></app-provider-icon>
          </span>
          <span>{{ provider.label }}</span>
        </span>
        <app-status-dot [status]="provider.info.status" size="sm" [glow]="false"></app-status-dot>
      </button>
    }

    @for (provider of futureProviders(); track provider.id) {
      <button type="button" class="mobile-tab mobile-tab-upcoming" disabled>
        <span class="mobile-tab-main">
          <span class="mobile-tab-icon mobile-tab-icon-upcoming">
            <img class="mobile-tab-brand" [src]="provider.iconUrl" alt="" aria-hidden="true" />
          </span>
          <span class="mobile-tab-copy">
            <span>{{ provider.label }}</span>
            <span class="mobile-tab-status">Coming soon</span>
          </span>
        </span>
      </button>
    }
  </div>
</nav>
