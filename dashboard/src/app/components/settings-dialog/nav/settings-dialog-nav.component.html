<aside class="settings-nav">
  <div class="settings-brand">
    <span class="settings-kicker u-kicker">Settings</span>
    <p>Adjust appearance, configure sources, and read the diagnostic log.</p>
  </div>

  @for (section of sections; track section.id) {
    <button
      class="nav-item nav-item-general"
      type="button"
      [class.active]="selection() === section.id"
      [attr.aria-current]="selection() === section.id ? 'page' : null"
      (click)="selected.emit(section.id)"
    >
      <span class="nav-item-main">
        <mat-icon>{{ section.icon }}</mat-icon>
        <span>{{ section.label }}</span>
      </span>
      <mat-icon>chevron_right</mat-icon>
    </button>
  }

  <div class="nav-group">
    <span class="nav-group-label u-kicker">Sources</span>

    @for (provider of providers(); track provider.key) {
      @let id = connectionSelection(provider.key);
      <button
        class="nav-item source-item"
        type="button"
        [class.active]="selection() === id"
        [attr.aria-current]="selection() === id ? 'page' : null"
        [attr.data-status]="provider.info.status"
        (click)="selected.emit(id)"
        [matTooltip]="provider.tooltip ?? ''"
        [matTooltipDisabled]="!provider.tooltip"
        matTooltipPosition="right"
      >
        <span class="nav-item-main">
          <app-provider-icon [source]="provider.info.connection.source" size="md" />
          <span class="source-copy">
            <span class="source-name">{{ provider.label }}</span>
            <span class="source-status">{{ providerStatusLabel(provider.info.status) }}</span>
            @if (provider.info.status !== 'available' && provider.info.reason) {
              <span class="source-reason">{{ provider.info.reason }}</span>
            }
          </span>
        </span>
        <app-status-dot [status]="provider.info.status" />
      </button>
    }

    <button
      class="nav-item nav-item-add"
      type="button"
      [class.active]="selection() === 'add'"
      [attr.aria-current]="selection() === 'add' ? 'page' : null"
      (click)="selected.emit('add')"
    >
      <span class="nav-item-main">
        <mat-icon>add</mat-icon>
        <span>Add source</span>
      </span>
    </button>
  </div>
</aside>
