<!--
  Everything here floats over the main panel: a collection that starts or ends
  must never push the timeline around.
-->
<div class="live-region" appAutoAnimate role="status" aria-live="polite">
  @if (banner(); as banner) {
    @if (banner.busy) {
      <div class="sync-pill" [attr.data-tone]="banner.tone" [title]="banner.message">
        <mat-icon class="sync-icon u-spin">{{ banner.icon }}</mat-icon>
        <span class="sync-title">{{ banner.title }}</span>
        <span class="u-sr-only">{{ banner.message }}</span>
        <span class="sync-elapsed" aria-hidden="true">{{ elapsedSeconds() }}s</span>
      </div>
    }
  }
</div>

@if (banner(); as banner) {
  @if (!banner.busy) {
    <div class="toast" role="alert" [attr.data-tone]="banner.tone">
      <mat-icon>{{ banner.icon }}</mat-icon>
      <div class="toast-copy">
        <strong class="toast-title">{{ banner.title }}</strong>
        <span class="toast-message">{{ banner.message }}</span>
      </div>
      <div class="toast-actions">
        @if (banner.retry) {
          <button appButton variant="primary" size="sm" icon="refresh" (click)="retry()">
            Retry
          </button>
        }
        <button appIconButton size="sm" icon="close" label="Dismiss" (click)="dismiss()"></button>
      </div>
    </div>
  }
}
