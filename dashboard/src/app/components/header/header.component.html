<header class="app-header">
  <div
    class="window-drag-strip"
    (mousedown)="startWindowDrag($event)"
    (dblclick)="toggleWindowMaximize($event)"
  ></div>
  <div
    class="header-inner"
    (mousedown)="startHeaderDrag($event)"
    (dblclick)="toggleHeaderMaximize($event)"
  >
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <mat-icon>timeline</mat-icon>
      </span>
      <span class="brand-title">Activity Log</span>
    </div>

    <!-- What the layout on screen puts in the header row, such as the views' range. -->
    <div class="header-center">
      <ng-container *ngTemplateOutlet="center()" />
    </div>

    <div class="header-actions" role="group" aria-label="Export">
      <button
        appIconButton
        icon="description"
        label="Export Markdown"
        size="lg"
        class="btn-action"
        (click)="exportMd()"
        [disabled]="!canExport()"
        matTooltip="Export Markdown"
      ></button>
      <button
        appIconButton
        icon="data_object"
        label="Export JSON"
        size="lg"
        class="btn-action"
        (click)="exportJson()"
        [disabled]="!canExport()"
        matTooltip="Export JSON"
      ></button>
    </div>
  </div>
</header>
