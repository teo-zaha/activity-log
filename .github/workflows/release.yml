name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Override with a version such as 1.2.3 (optional)'
        type: string
      draft:
        description: 'Leave the GitHub Release as a draft for editing'
        type: boolean
        default: false
      dry_run:
        description: 'Build and check everything without pushing or creating a release'
        type: boolean
        default: false

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  prepare:
    permissions:
      contents: read
      actions: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Reject dispatches outside main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release runs only on main"
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ $(git rev-parse refs/remotes/origin/main) != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced. Dispatch Release from its new head."
            exit 1
          fi
          count=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/linux.yml/runs" \
            -f branch=main -f head_sha="$GITHUB_SHA" -f status=success --jq .total_count)
          if [[ $count == 0 ]]; then
            echo "::error::Linux CI must pass on main at $GITHUB_SHA before a release."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2

      - name: Prepare release commit and notes
        id: release
        env:
          VERSION: ${{ inputs.version }}
          GITHUB_REPO: ${{ github.repository }}
          RELEASE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          export -n RELEASE_GITHUB_TOKEN
          dir="$RUNNER_TEMP/release-input"
          mkdir -p "$dir"
          tag=$(GITHUB_TOKEN="$RELEASE_GITHUB_TOKEN" python3 scripts/release.py prepare --version "$VERSION" --notes "$dir/notes.md")
          if [[ -z $tag ]]; then
            echo "No pending release."
            exit 0
          fi
          git add -- Cargo.toml Cargo.lock CHANGELOG.md
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore(release): $tag"
          git bundle create "$dir/release.bundle" HEAD
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          cat "$dir/notes.md" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: steps.release.outputs.tag != ''
        with:
          name: release-input
          path: ${{ runner.temp }}/release-input/
          if-no-files-found: error
          overwrite: true

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    uses: ./.github/workflows/desktop-build.yml
    with:
      release_sha: ${{ needs.prepare.outputs.sha }}

  publish:
    needs: [prepare, build]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ (!inputs.dry_run && secrets.RELEASE_PAT) || github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: release-input
          path: ${{ runner.temp }}/release-input

      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          merge-multiple: true
          path: ${{ runner.temp }}/release-assets

      - name: Verify the release commit and bundles
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch --no-tags "$RUNNER_TEMP/release-input/release.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          test "$(git show -s --format=%P "$RELEASE_SHA")" = "$GITHUB_SHA"
          git diff --exit-code "$GITHUB_SHA" "$RELEASE_SHA" -- . \
            ':(exclude)Cargo.toml' ':(exclude)Cargo.lock' ':(exclude)CHANGELOG.md'

          shopt -s globstar nullglob
          manifest="$RUNNER_TEMP/release-assets.txt"
          staging="$RUNNER_TEMP/release-upload"
          mkdir -p "$staging"
          for pattern in '*-setup.exe' '*.dmg' '*.deb' '*.rpm' '*.AppImage'; do
            # Expand each pattern against the downloaded bundles.
            # shellcheck disable=SC2206
            matches=("$RUNNER_TEMP"/release-assets/**/$pattern)
            if [[ ${#matches[@]} != 1 ]]; then
              echo "::error::Expected one $pattern asset, got ${#matches[@]}." >&2
              exit 1
            fi
            name=${matches[0]##*/}
            # Tauri uses name-version-release.arch.rpm or name_version_arch.ext.
            if [[ $name == *.rpm ]]; then
              prefix=${name%-*}
              asset_version=${prefix##*-}
            else
              prefix=${name%_*}
              asset_version=${prefix##*_}
            fi
            if [[ $asset_version != "${TAG#v}" ]]; then
              echo "::error::Asset $name has version $asset_version, expected ${TAG#v}." >&2
              exit 1
            fi
            # Use a stable filename on GitHub, which rewrites spaces in asset names.
            asset="$staging/${name// /-}"
            mv -- "${matches[0]}" "$asset"
            printf '%s\n' "$asset"
          done > "$manifest"
          cat "$manifest"

      - name: Check remote refs and push the release
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          git fetch --no-tags origin refs/heads/main
          remote_main=$(git rev-parse FETCH_HEAD)
          tag_refs=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}")
          if [[ -n $tag_refs ]]; then
            # ls-remote lists the peeled commit last for an annotated tag.
            tag_commit=$(awk 'END {print $1}' <<< "$tag_refs")
            if [[ $tag_commit != "$RELEASE_SHA" ]]; then
              echo "::error::$TAG points to $tag_commit, expected $RELEASE_SHA."
              exit 1
            fi
            if ! git merge-base --is-ancestor "$RELEASE_SHA" "$remote_main"; then
              echo "::error::$TAG is already present but its release commit is missing from main."
              exit 1
            fi
            echo "$TAG is already pushed."
            exit 0
          fi
          if [[ $remote_main != "$GITHUB_SHA" ]]; then
            echo "::error::main advanced. Dispatch Release from its new head."
            exit 1
          fi
          if [[ $DRY_RUN == true ]]; then
            echo "Dry run verified $TAG without pushing."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            tag -a "$TAG" "$RELEASE_SHA" -m "Release $TAG"
          git push --atomic --no-follow-tags \
            --force-with-lease="refs/heads/main:$GITHUB_SHA" \
            --force-with-lease="refs/tags/$TAG:" origin \
            "$RELEASE_SHA:refs/heads/main" "refs/tags/$TAG:refs/tags/$TAG"

      - name: Upload bundles to the draft
        if: '!inputs.dry_run'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          state=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --slurp \
            | jq -r --arg tag "$TAG" '.[][] | select(.tag_name == $tag) | .draft')
          mapfile -t assets < "$RUNNER_TEMP/release-assets.txt"
          case "$state" in
            '')
              gh release create "$TAG" --verify-tag --draft --title "$TAG" \
                --notes-file "$RUNNER_TEMP/release-input/notes.md"
              ;;
            true) ;;
            false)
              names=$(gh release view "$TAG" --json assets --jq '.assets[].name')
              for asset in "${assets[@]}"; do
                if ! grep -Fxq "${asset##*/}" <<< "$names"; then
                  echo "::error::Published release $TAG is missing ${asset##*/}."
                  exit 1
                fi
              done
              echo "$TAG is already published with all bundles."
              exit 0
              ;;
            *)
              echo "::error::Multiple releases found for $TAG."
              exit 1
              ;;
          esac
          gh release upload "$TAG" --clobber "${assets[@]}"
          if [[ $DRAFT != true ]]; then
            gh release edit "$TAG" --draft=false
          fi
