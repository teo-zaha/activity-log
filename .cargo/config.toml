[env]
TS_RS_EXPORT_DIR = { value = "target/ts-rs-bindings", relative = true }

# cargo-xwin's downloaded MSVC CRT ships without PDBs; lld-link warns (LNK4099)
# for every CRT object when it can't find them. The warning is harmless.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "link-arg=/ignore:4099"]
