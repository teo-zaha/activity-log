<aside class="sidebar">
  <div class="sidebar-section sidebar-section-view">
    <span class="section-label">View</span>
    <div class="view-toggle">
      <button
        class="view-btn"
        [class.active]="activity.currentView() === 'list'"
        (click)="activity.setView('list')"
      >
        <mat-icon>view_list</mat-icon>List
      </button>
      <button
        class="view-btn"
        [class.active]="activity.currentView() === 'day'"
        (click)="activity.setView('day')"
      >
        <mat-icon>calendar_today</mat-icon>Day
      </button>
      <button
        class="view-btn"
        [class.active]="activity.currentView() === 'workweek'"
        (click)="activity.setView('workweek')"
      >
        <mat-icon>view_week</mat-icon>Work Week
      </button>
      <button
        class="view-btn"
        [class.active]="activity.currentView() === 'week'"
        (click)="activity.setView('week')"
      >
        <mat-icon>calendar_view_week</mat-icon>Week
      </button>
    </div>
  </div>

  <div class="sidebar-section sidebar-section-sources">
    <span class="section-label">Sources</span>
    <div class="source-chips">
      @for (provider of activity.providers(); track provider.info.id) {
        <span
          class="filter-chip-wrap"
          [matTooltip]="provider.tooltip"
          matTooltipPosition="above"
          (dblclick)="activity.isolateSource(provider.info.id)"
        >
          <button
            class="filter-chip"
            [class.active]="isActive(provider.info.id)"
            [class.degraded]="provider.info.status === 'degraded'"
            [attr.data-src]="provider.chipKey"
            (click)="activity.toggleSource(provider.info.id)"
          >
            <app-provider-icon
              class="filter-chip-icon"
              [source]="provider.info.id"
              [fallbackIcon]="provider.icon"
            ></app-provider-icon>
            {{ provider.label }}
            @if (provider.count > 0) {
              <span class="chip-count">{{ provider.count }}</span>
            }
          </button>
        </span>
      }
    </div>
  </div>
  <div class="sidebar-bottom">
    <button class="settings-button" type="button" (click)="openSettings()">
      <mat-icon>settings</mat-icon>
      <span>Settings</span>
    </button>
  </div>
</aside>
