# Builds the workspace for Linux, where the macOS and Windows children are left
# out, through clippy with warnings as errors, and runs the backend's tests
# there. `pnpm verify` only covers the dev host OS. It runs on every pull request and
# push to main; Windows and macOS run on main and by hand (see their workflows).
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request stops its run still in progress; runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # What the desktop crate links against (Tauri's WebKitGTK shell), as in
      # the Desktop Build workflow.
      - name: Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            dbus \
            gnome-keyring

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The desktop crate builds without the dashboard: without Tauri's
      # `custom-protocol` feature it loads the dev server instead of embedding
      # `dashboard/dist`.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (real-store tests)
        run: cargo clippy -p core --all-targets --features real-store-tests -- -D warnings

      # The desktop's tests have not been run on a headless Linux runner yet;
      # they run on Windows and in `pnpm verify`.
      - name: Test
        run: cargo test --workspace --exclude activity-log-desktop

      # The Secret Service itself (core's real-store tests, on an item of their own): GNOME
      # Keyring on a private session bus, then no bus at all, which must be `Unavailable`.
      # `CI=true` and this variable are the marker they refuse to run without.
      - name: Real secret store
        env:
          ACTIVITY_LOG_REAL_STORE_TESTS: '1'
        run: |
          dbus-run-session -- sh -c '
            printf ci | gnome-keyring-daemon --unlock --components=secrets
            cargo test -p core --features real-store-tests --test real_secret_store
          '

      - name: Real secret store without a session bus
        env:
          ACTIVITY_LOG_REAL_STORE_TESTS: '1'
        run: |
          env -u DBUS_SESSION_BUS_ADDRESS XDG_RUNTIME_DIR=/nonexistent \
            cargo test -p core --features real-store-tests --test real_secret_store \
            -- --ignored without_a_session_bus
