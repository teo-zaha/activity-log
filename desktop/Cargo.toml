[package]
name = "activity-log-desktop"
edition.workspace = true
version.workspace = true
default-run = "activity-log-desktop"

[lib]
name = "activity_log_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
activity-log-core = { package = "core", path = "../core" }
anyhow.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3.27"
