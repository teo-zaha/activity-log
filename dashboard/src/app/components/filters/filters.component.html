<aside class="filters-sidebar">
  <div class="sidebar-section">
    <span class="section-label">View</span>
    <div class="view-toggle">
      <button
        class="view-btn"
        [class.active]="activity.currentView() === 'list'"
        (click)="activity.setView('list')"
      >
        <mat-icon>view_list</mat-icon>List
      </button>
      <button
        class="view-btn"
        [class.active]="activity.currentView() === 'day'"
        (click)="activity.setView('day')"
      >
        <mat-icon>calendar_today</mat-icon>Day
      </button>
      <button
        class="view-btn"
        [class.active]="activity.currentView() === 'workweek'"
        (click)="activity.setView('workweek')"
      >
        <mat-icon>view_week</mat-icon>Work Week
      </button>
      <button
        class="view-btn"
        [class.active]="activity.currentView() === 'week'"
        (click)="activity.setView('week')"
      >
        <mat-icon>calendar_view_week</mat-icon>Week
      </button>
    </div>
  </div>

  <div class="sidebar-section">
    <div class="section-header">
      <span class="section-label">Sources</span>
      <button
        class="toggle-unavailable-btn"
        (click)="activity.toggleHideUnavailable()"
        [matTooltip]="
          activity.hideUnavailable() ? 'Show unavailable sources' : 'Hide unavailable sources'
        "
        matTooltipPosition="above"
      >
        <mat-icon>{{ activity.hideUnavailable() ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </div>
    <div class="source-chips">
      @for (provider of activity.visibleProviders(); track provider.info.id) {
        <span
          class="filter-chip-wrap"
          [matTooltip]="provider.tooltip"
          matTooltipPosition="above"
          (dblclick)="activity.isolateSource(src.id)"
        >
          <button
            class="filter-chip"
            [class.active]="isActive(provider.info.id)"
            [class.degraded]="provider.info.status === 'degraded'"
            [attr.data-src]="provider.chipKey"
            [disabled]="!provider.info.usable"
            (click)="activity.toggleSource(provider.info.id)"
          >
            <mat-icon>{{ provider.icon }}</mat-icon>
            {{ provider.label }}
            @if (provider.count > 0) {
              <span class="chip-count">{{ provider.count }}</span>
            }
          </button>
        </span>
      }
    </div>
  </div>
  <div class="sidebar-bottom">
    <span class="section-label">Theme</span>
    <div class="theme-swatches">
      @for (t of themes; track t.id) {
        <button
          class="theme-swatch"
          [class.active]="theme.theme() === t.id"
          [attr.data-swatch]="t.id"
          (click)="theme.setTheme(t.id)"
          [matTooltip]="t.label"
          matTooltipPosition="above"
        ></button>
      }
    </div>
  </div>
</aside>
