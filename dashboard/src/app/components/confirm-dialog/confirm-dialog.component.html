<div class="confirm">
  <h2 mat-dialog-title class="confirm-title">{{ data.title }}</h2>
  <p mat-dialog-content class="confirm-message">{{ data.message }}</p>
  <div mat-dialog-actions class="confirm-actions">
    <button type="button" class="u-btn u-btn-ghost" [mat-dialog-close]="false">Cancel</button>
    <button
      type="button"
      class="u-btn"
      [class.u-btn-primary]="data.tone !== 'danger'"
      [class.u-btn-danger]="data.tone === 'danger'"
      [mat-dialog-close]="true"
    >
      {{ data.confirmLabel }}
    </button>
  </div>
</div>
