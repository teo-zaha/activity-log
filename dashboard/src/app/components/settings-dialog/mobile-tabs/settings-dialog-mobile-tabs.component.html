<nav class="mobile-tabs" aria-label="Settings sections">
  <div class="mobile-tab-list">
    @for (section of sections; track section.id) {
      <button
        type="button"
        class="mobile-tab"
        [class.active]="selection() === section.id"
        (click)="selected.emit(section.id)"
      >
        <span class="mobile-tab-main">
          <mat-icon>{{ section.icon }}</mat-icon>
          <span>{{ section.label }}</span>
        </span>
      </button>
    }

    @for (provider of providers(); track provider.key) {
      @let id = connectionSelection(provider.key);
      <button
        type="button"
        class="mobile-tab"
        [class.active]="selection() === id"
        (click)="selected.emit(id)"
      >
        <span class="mobile-tab-main">
          <app-provider-icon [source]="provider.info.connection.source" size="sm" />
          <span>{{ provider.label }}</span>
        </span>
        <app-status-dot [status]="provider.info.status" size="sm" [glow]="false" />
      </button>
    }

    <button
      type="button"
      class="mobile-tab"
      [class.active]="selection() === 'add'"
      (click)="selected.emit('add')"
    >
      <span class="mobile-tab-main">
        <mat-icon>add</mat-icon>
        <span>Add source</span>
      </span>
    </button>
  </div>
</nav>
