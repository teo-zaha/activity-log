[workspace]
members = ["core", "api", "cli", "desktop"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
dotenvy = "0.15"
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
rfd = { version = "0.16", default-features = false, features = [
  "tokio",
  "wayland",
  "xdg-portal",
] }
rocket = { version = "0.5", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.27", features = ["derive"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "sync", "process"] }
ts-rs = { version = "10.1", default-features = false, features = [
  "chrono-impl",
] }
urlencoding = "2.1"
