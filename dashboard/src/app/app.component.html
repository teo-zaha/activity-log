<!-- Focuses the main content in place: following `#main-content` would leave the route. -->
<a
  class="skip-link"
  href="#main-content"
  [attr.inert]="activity.detailsOpen() ? '' : null"
  (click)="skipToMain($event)"
  >Skip to activity</a
>

<mat-progress-bar
  mode="indeterminate"
  class="top-loader"
  [class.visible]="activity.isLoading()"
  aria-hidden="true"
/>

<router-outlet />

@if (chrome.frameless) {
  <app-window-controls />
}
