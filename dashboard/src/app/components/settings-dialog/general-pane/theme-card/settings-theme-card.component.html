<div class="theme-grid">
  @for (themeOption of themes; track themeOption.id) {
    @let active = isThemeActive(themeOption.id);
    <button
      #swatch
      type="button"
      role="radio"
      class="swatch"
      [attr.aria-checked]="active"
      [tabindex]="active ? 0 : -1"
      (click)="selectTheme(themeOption.id)"
    >
      <span class="preview" [attr.data-theme-option]="themeOption.id" aria-hidden="true">
        <span class="preview-accent"></span>
        <span class="preview-lines"><span></span><span></span><span></span></span>
      </span>
      <span class="swatch-label">
        {{ themeOption.label }}
        @if (active) {
          <mat-icon>check_circle</mat-icon>
        }
      </span>
    </button>
  }
</div>
