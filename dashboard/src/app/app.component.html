<a class="skip-link" href="#main-content">Skip to activity</a>

<mat-progress-bar
  mode="indeterminate"
  class="top-loader"
  [class.visible]="activity.isLoading()"
  aria-hidden="true"
/>

<app-header />

<div class="shell">
  <app-sidebar />

  <main
    id="main-content"
    class="main-content"
    tabindex="-1"
    [attr.aria-busy]="activity.isLoading()"
  >
    <app-collection-status />

    @switch (activity.currentView()) {
      @case ('list') {
        <app-timeline />
      }
      @case ('day') {
        <app-day-view />
      }
      @case ('workweek') {
        <app-week-view />
      }
      @case ('week') {
        <app-week-view />
      }
    }
  </main>
</div>

<app-event-detail />
