<header class="app-header">
  <div
    class="window-drag-strip"
    (mousedown)="startWindowDrag($event)"
    (dblclick)="toggleWindowMaximize($event)"
  ></div>
  <div
    class="header-inner"
    (mousedown)="startHeaderDrag($event)"
    (dblclick)="toggleHeaderMaximize($event)"
  >
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <span class="material-icons">timeline</span>
      </span>
      <span class="brand-title">Activity Log</span>
    </div>

    <form class="range-form" [formRoot]="rangeForm" aria-label="Collection date range">
      <div class="range" [class.is-disabled]="activity.isLoading()">
        <label class="range-field">
          <span class="range-label">From</span>
          <input
            class="range-input"
            aria-label="From date"
            [matDatepicker]="pickerFrom"
            [formField]="rangeForm.from"
            [max]="dateToObj()"
            (dateChange)="activity.dateFrom.set(fmtDate($event.value))"
          />
          <mat-datepicker-toggle class="range-toggle" [for]="pickerFrom" />
          <mat-datepicker #pickerFrom />
        </label>

        <span class="range-sep material-icons" aria-hidden="true">arrow_forward</span>

        <label class="range-field">
          <span class="range-label">To</span>
          <input
            class="range-input"
            aria-label="To date"
            [matDatepicker]="pickerTo"
            [formField]="rangeForm.to"
            [min]="dateFromObj()"
            (dateChange)="activity.dateTo.set(fmtDate($event.value))"
          />
          <mat-datepicker-toggle class="range-toggle" [for]="pickerTo" />
          <mat-datepicker #pickerTo />
        </label>
      </div>

      <button
        type="submit"
        class="u-btn u-btn-primary btn-collect"
        [class.is-busy]="activity.isLoading()"
        [disabled]="activity.isLoading()"
        [attr.aria-label]="activity.isLoading() ? 'Collecting activity' : 'Collect activity'"
        matTooltip="Collect activity for the selected range"
      >
        <span class="material-icons" [class.u-spin]="activity.isLoading()" aria-hidden="true">{{
          activity.isLoading() ? 'autorenew' : 'sync'
        }}</span>
        <!-- Both labels share one grid cell so the button keeps its width while busy. -->
        <span class="btn-collect-label" aria-hidden="true">
          <span [class.is-inactive]="activity.isLoading()">Collect</span>
          <span [class.is-inactive]="!activity.isLoading()">Collecting…</span>
        </span>
      </button>
    </form>

    <div class="header-actions" role="group" aria-label="Export">
      <button
        type="button"
        class="u-btn u-btn-icon btn-export"
        (click)="exportMd()"
        [disabled]="!activity.meta()"
        matTooltip="Export Markdown"
        aria-label="Export Markdown"
      >
        <span class="material-icons" aria-hidden="true">description</span>
      </button>

      <button
        type="button"
        class="u-btn u-btn-icon btn-export"
        (click)="exportJson()"
        [disabled]="!activity.meta()"
        matTooltip="Export JSON"
        aria-label="Export JSON"
      >
        <span class="material-icons" aria-hidden="true">data_object</span>
      </button>
    </div>
  </div>
</header>
