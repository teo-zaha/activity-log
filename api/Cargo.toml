[package]
name = "api"
edition.workspace = true
version.workspace = true

[lib]
name = "activity_log_api"
path = "src/lib.rs"

[dependencies]
activity-log-core = { package = "core", path = "../core" }
anyhow.workspace = true
rocket.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# `test-support`: a `Secrets` over stores in memory, and no OS store in any `Secrets` the
# tests or the binaries they run build (feature unification), so no test reaches a keychain.
activity-log-core = { package = "core", path = "../core", features = ["test-support"] }
tempfile = "3.27"
tokio = { workspace = true, features = ["test-util"] }
