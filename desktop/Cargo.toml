[package]
name = "activity-log-desktop"
edition.workspace = true
version.workspace = true
default-run = "activity-log-desktop"

[lib]
name = "activity_log_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
activity-log-core = { package = "core", path = "../core" }
anyhow.workspace = true
futures.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.5", features = [] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-notification = "2.8.1"
tauri-plugin-opener = "2.7.3"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
tauri-plugin-window-state = "2.5.0"
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
# The version Tauri's wry uses, for the controller `WebviewWindow::with_webview` hands out.
webview2-com = "0.39.1"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# `test-support`: a `Secrets` over stores in memory, and no OS store in any `Secrets` the
# tests or the binaries they run build (feature unification), so no test reaches a keychain.
activity-log-core = { package = "core", path = "../core", features = ["test-support"] }
# The accelerator parser Tauri's menu uses (the version in its tree), to check ours parse.
muda = { version = "0.20.0", default-features = false }
strum.workspace = true
tempfile = "3.27"
tokio = { workspace = true, features = ["test-util"] }
# The mock runtime, to call commands as the dashboard does and see what they answer.
tauri = { version = "2.12.5", features = ["test"] }
