# Builds the desktop bundles on all three systems, for a release or by hand.
# The macOS build costs ten Linux minutes for each of its own, the Windows one two.
name: Desktop Build (All OS)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_sha:
        description: 'Commit in the release-input artifact'
        type: string
        required: true

permissions:
  contents: read

# Only smoke builds started by hand can cancel an earlier run of this workflow.
concurrency:
  group: ${{ inputs.release_sha && format('desktop-release-{0}', github.run_id) || format('desktop-build-dispatch-{0}', github.ref) }}
  cancel-in-progress: ${{ !inputs.release_sha }}

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm,appimage
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        if: inputs.release_sha
        with:
          name: release-input
          path: ${{ runner.temp }}/release-input

      - name: Check out the prepared release commit
        if: inputs.release_sha
        shell: bash
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
        run: |
          git fetch --no-tags "$RUNNER_TEMP/release-input/release.bundle" HEAD
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA"
          git checkout --detach "$RELEASE_SHA"

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # The installer is built from our copy of Tauri's NSIS template: it must be the CLI's
      - name: Check the NSIS template matches the Tauri CLI
        if: matrix.os == 'windows-latest'
        shell: bash
        run: desktop/installer/template.sh check

      - name: Build desktop bundles
        shell: bash
        env:
          BUNDLES: ${{ matrix.bundles }}
        run: |
          pnpm desktop:build --bundles "$BUNDLES"
          git diff --exit-code -- Cargo.lock

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/dmg/*.dmg
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          overwrite: true
