[workspace]
members = ["core", "api", "cli", "desktop"]
resolver = "2"

[workspace.package]
edition = "2024"
version = "1.0.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4.6", features = ["derive"] }
futures = "0.3"
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "rustls",
] }
rfd = "0.17"
rocket = { version = "0.5", features = ["json"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
strum = { version = "0.28", features = ["derive"] }
tokio = { version = "1.54", features = ["macros", "process", "rt-multi-thread", "sync", "time"] }
ts-rs = { version = "12.0", default-features = false, features = [
  "chrono-impl",
] }
urlencoding = "2.1"

# Dependencies are optimized in debug builds too: reading Git history with an unoptimized gix
# takes several times longer, which made `pnpm desktop:dev` slow to collect. Our own crates
# stay unoptimized, so they still build fast and debug well.
[profile.dev.package."*"]
opt-level = 2
